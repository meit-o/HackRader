name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      TEST_DATABASE_URL: postgresql://postgres:audit-local-only@127.0.0.1:5432/hackradar_audit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: audit-local-only
          POSTGRES_DB: hackradar_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hackradar_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify core logic
        run: npm run verify:core

      - name: Verify event workflow
        run: npm run verify:flow

      - name: Production build
        run: npm run build

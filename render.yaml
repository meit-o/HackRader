databases:
  - name: hackradar-db
    databaseName: hackradar
    user: hackradar
    plan: 0.5c-1g
    region: singapore

services:
  - type: web
    name: hackradar
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hackradar-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: AUTH_SECRET
        generateValue: true
      - key: ENABLE_DEMO_MODE
        value: "false"
